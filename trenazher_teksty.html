<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тексты для пересказа, названия, плана</title>
<style>
:root{--bg:#0e1330;--card:#1a2050;--card-2:#222a63;--ink:#f4e9d0;--dim:#b8c0e0;--line:#39427f;--gold:#f0b429;--gold-lt:#ffd166;--ok:#48c98e;--bad:#e8604f;--ink-on-gold:#2a1f05;--shadow:0 10px 30px rgba(0,0,0,.45)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:radial-gradient(1100px 620px at 80% -10%, rgba(255,209,102,.18), transparent 62%),radial-gradient(820px 560px at 4% 106%, rgba(129,116,224,.20), transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font-size:17px;min-height:100vh;padding-bottom:24px}
header{position:relative;background:linear-gradient(135deg,#a83246,#6d1f2e);padding:18px;border-bottom:2px solid var(--gold);box-shadow:0 6px 24px rgba(0,0,0,.45)}
header .in{max-width:980px;margin:0 auto}
header h1{margin:0;font-size:24px;color:#fff3d6}
.tgl{position:absolute;right:14px;top:14px;background:transparent;border:1px solid rgba(255,243,214,.5);color:#fff3d6;border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer}
main{max-width:980px;margin:16px auto;padding:0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.row{display:flex;gap:8px;flex-wrap:wrap}
select,button{font-family:inherit;font-size:15px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card-2);color:var(--ink);padding:6px 10px}
.btn{background:linear-gradient(180deg,var(--gold-lt),var(--gold));color:var(--ink-on-gold);font-weight:700;border:none}
.text{white-space:pre-wrap;line-height:1.7;margin-top:10px}
.q{margin:8px 0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card-2)}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.opt{padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.opt.sel{border-color:var(--ok)}
.back{color:var(--gold-lt);text-decoration:none}
</style>
</head>
<body>
<header>
  <div class="in"><h1>Тексты для пересказа, названия, плана</h1></div>
  <button class="tgl" id="themeBtn">Светлая</button>
</header>
<main>
  <div class="card">
    <div class="row">
      <select id="age"><option value="6-12">6-12</option><option value="13-17">13-17</option><option value="18+">18+</option></select>
      <select id="genre"><option value="детские">детские</option><option value="классика">классика</option><option value="современная">современная</option><option value="научная">научная</option></select>
      <select id="task"><option value="пересказ">пересказ</option><option value="название">название</option><option value="план">план</option></select>
      <select id="level"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>
      <button class="btn" onclick="gen()">Сгенерировать</button>
      <button class="btn" onclick="gen()">Ещё</button>
    </div>
    <div id="info" style="color:var(--dim);margin-top:6px"></div>
    <div id="text" class="text"></div>
  </div>
  <div class="card" id="qcard" style="display:none"><h3>Вопросы</h3><div id="qlist"></div></div>
  <div class="card" id="openCard" style="display:none"><h3 id="openTitle"></h3><textarea style="width:100%;min-height:60px;border-radius:8px;background:var(--card-2);color:var(--ink);border:1px solid var(--line)"></textarea></div>
  <a class="back" href="index.html">Назад</a>
</main>
<script src="teksty_data.js"></script>
<script>
var D = window.TEKSTY_DATA || {items:[]};
function gen(){
  var age=document.getElementById('age').value;
  var genre=document.getElementById('genre').value;
  var task=document.getElementById('task').value;
  var level=parseInt(document.getElementById('level').value);
  var list=D.items.filter(function(x){return x.age===age && x.genre===genre && x.task===task && x.level===level;});
  if(list.length===0) list=D.items.filter(function(x){return x.age===age && x.task===task && x.level===level;});
  if(list.length===0) list=D.items.filter(function(x){return x.age===age && x.task===task;});
  if(list.length===0){document.getElementById('text').textContent='Нет данных'; document.getElementById('qcard').style.display='none'; document.getElementById('openCard').style.display='none'; return;}
  var item=list[Math.floor(Math.random()*list.length)];
  document.getElementById('text').textContent=item.text;
  document.getElementById('info').textContent='Слов: '+item.words;
  if(task==='пересказ'){
    document.getElementById('qcard').style.display='block'; document.getElementById('openCard').style.display='none';
    var l=document.getElementById('qlist'); l.innerHTML='';
    var qs=item.questions||[];
    for(var i=0;i<qs.length;i++){
      var q=qs[i]; var div=document.createElement('div'); div.className='q'; div.textContent=(i+1)+'. '+q.q; l.appendChild(div);
    }
  }else{
    document.getElementById('qcard').style.display='none'; document.getElementById('openCard').style.display='block';
    document.getElementById('openTitle').textContent=task==='название'?'Придумай название':'Составь план';
  }
}
</script>
</body>
</html>
